<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny's Sky Reader</title>
<style>
  :root { --bg: #dff1ff; --ink: #16223a; --accent: #f5a00a; --panel: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a1124; --ink: #e7edfb; --accent: #ffb92e; --panel: #111b36; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(#8fd0ff, var(--bg)); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .card { width: min(92vw, 420px); padding: 2.2rem 1.4rem; background: var(--panel); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .plane { font-size: 3.4rem; line-height: 1; margin-bottom: .4rem; }
  h1 { margin: 0 0 .4rem; font-size: 2rem; }
  h1 span { color: var(--accent); }
  p { margin: .2rem 0 1.4rem; opacity: .8; }
  button { font: inherit; font-size: 1.1rem; padding: .8em 1.8em; border: 0; border-radius: 14px; background: var(--ink); color: var(--panel); cursor: pointer; min-height: 48px; }
  #msg { margin-top: 1rem; min-height: 1.4em; font-size: .95rem; }
</style>
</head>
<body>
  <main class="card">
    <div class="plane" aria-hidden="true">✈️</div>
    <h1><span>Sunny's</span> Sky Reader</h1>
    <p>영어 문장을 읽고 하늘을 지켜요!</p>
    <button id="closeBtn" type="button">닫기</button>
    <div id="msg" role="status"></div>
  </main>
<script>
  document.getElementById('closeBtn').addEventListener('click', function () {
    var msg = document.getElementById('msg');
    window.close();
    // Browsers only allow closing tabs a script opened; otherwise show a hint instead.
    setTimeout(function () {
      if (!window.closed) msg.textContent = '이 탭은 직접 닫아 주세요. (브라우저 탭의 X 버튼)';
    }, 300);
  });
</script>
</body>
</html>
